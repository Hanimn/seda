name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Global-hotkey and real-microphone behavior can't run in headless CI; the
# tests mock those boundaries and are marked "integration" where they'd need
# real hardware, models, or network. CI runs only "not integration".
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Build package
        run: uv build

      - name: Verify CLI --help
        run: uv run seda --help
